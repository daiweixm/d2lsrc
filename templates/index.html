<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脚本执行器</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            margin-top: 50px;
            max-width: 800px;
        }
        .output-area {
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            background-color: #f8f9fa;
            font-family: monospace;
            font-size: 14px;
        }
        .output-line {
            margin-bottom: 5px;
            line-height: 1.4;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,.3);
            border-radius: 50%;
            border-top-color: #007bff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn:disabled {
            opacity: 0.65;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">脚本执行器</h1>
        
        <div class="card">
            <div class="card-body">
                <form id="scriptForm">
                    <div class="mb-3">
                        <label for="path" class="form-label">路径地址</label>
                        <input type="text" class="form-control" id="path" name="path" placeholder="请输入路径" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" id="runBtn">
                            <span id="btnText">执行脚本</span>
                            <span class="loading" id="loading" style="display: none;"></span>
                        </button>
                        <button type="button" class="btn btn-secondary" id="clearBtn" onclick="clearOutput()">清空输出</button>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="output-area" id="output"></div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 表单提交事件处理
        document.getElementById('scriptForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const path = formData.get('path');
            
            // 禁用按钮，显示加载状态
            const runBtn = document.getElementById('runBtn');
            const btnText = document.getElementById('btnText');
            const loading = document.getElementById('loading');
            runBtn.disabled = true;
            btnText.textContent = '执行中...';
            loading.style.display = 'inline-block';
            
            // 添加初始输出
            addOutput(`正在执行脚本，路径: ${path}`);
            
            try {
                // 发送请求启动脚本
                const response = await fetch('/run_script', {
                    method: 'POST',
                    body: new URLSearchParams(formData)
                });
                
                if (!response.ok) {
                    throw new Error(await response.text());
                }
                
                // 获取会话ID
                const sessionId = await response.text();
                
                // 建立SSE连接，实时获取输出
                connectToStream(sessionId, path);
            } catch (error) {
                addOutput(`错误: ${error.message}`, 'error');
                // 恢复按钮状态
                runBtn.disabled = false;
                btnText.textContent = '执行脚本';
                loading.style.display = 'none';
            }
        });
        
        // 连接到SSE流
        function connectToStream(sessionId, path) {
            const eventSource = new EventSource(`/stream/${sessionId}?path=${encodeURIComponent(path)}`);
            
            eventSource.onmessage = (event) => {
                const data = event.data;
                addOutput(data);
                
                // 检查是否执行完成
                if (data.includes('脚本执行完成')) {
                    eventSource.close();
                    // 恢复按钮状态
                    const runBtn = document.getElementById('runBtn');
                    const btnText = document.getElementById('btnText');
                    const loading = document.getElementById('loading');
                    runBtn.disabled = false;
                    btnText.textContent = '执行脚本';
                    loading.style.display = 'none';
                }
            };
            
            eventSource.onerror = (error) => {
                addOutput(`连接错误: ${error.type}`, 'error');
                eventSource.close();
                // 恢复按钮状态
                const runBtn = document.getElementById('runBtn');
                const btnText = document.getElementById('btnText');
                const loading = document.getElementById('loading');
                runBtn.disabled = false;
                btnText.textContent = '执行脚本';
                loading.style.display = 'none';
            };
        }
        
        // 添加输出到显示区域
        function addOutput(text, type = 'info') {
            const outputDiv = document.getElementById('output');
            const lineDiv = document.createElement('div');
            lineDiv.className = `output-line text-${type}`;
            
            // 添加时间戳
            const timestamp = new Date().toLocaleTimeString();
            lineDiv.innerHTML = `<span style="color: #6c757d; margin-right: 10px;">[${timestamp}]</span>${text}`;
            
            outputDiv.appendChild(lineDiv);
            // 滚动到底部
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }
        
        // 清空输出
        function clearOutput() {
            document.getElementById('output').innerHTML = '';
        }
        
        // 页面加载完成后聚焦输入框
        window.onload = () => {
            document.getElementById('path').focus();
        };
    </script>
</body>
</html>
